name: PrizePicks +EV Autonomous Cloud Pipeline

on:
  schedule:
    # Runs at 9:00 AM PT (16:00 UTC) - Morning Window (Injury Latency)
    - cron: '0 16 * * *'
    # Runs at 2:00 PM PT (21:00 UTC) - Afternoon Window (Sharp Consensus Pre-Lock)
    - cron: '0 21 * * *'
    # Runs at 9:30 PM PT (04:30 UTC next day) - Nightly Settlement & Discord Card
    - cron: '30 4 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Web UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit and push updated paper_bets.json

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Fonts (for Pillow slip rendering)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core fonts-freefont-ttf

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Automated Pipeline
        run: |
          # 1. Run settlement for previous games first
          python paper_tracker.py settle-auto || true

          # 2. Run +EV Auto Bot to scan and place any eligible slips (threshold: 57%)
          python auto_bot.py --threshold 57.0 || true

      - name: Commit & Push Updated Database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add paper_bets.json paper_bets.csv
          if git diff --staged --quiet; then
            echo "No database changes to commit."
          else
            git commit -m "Auto-update paper trading database [skip ci]"
            git push
          fi
